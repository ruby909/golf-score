<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>115年春季會內賽-彈性計分版</title>
    <style>
        :root { --primary: #1b4332; --accent: #d32f2f; --bg: #f8fafc; --invalid: #ffe4e6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .sticky-header { position: sticky; top: 0; z-index: 1000; background: white; border-bottom: 2px solid #cbd5e1; padding: 8px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-bar { display: flex; overflow-x: auto; gap: 6px; padding: 5px 12px; }
        .nav-bar::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 0 0 auto; width: 40px; height: 40px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; color: var(--primary); cursor: pointer; }
        .action-bar { display: flex; justify-content: center; gap: 10px; padding: 8px 0; }
        .btn { padding: 8px 16px; font-size: 14px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; }
        .btn-rank { background: var(--accent); }
        .btn-print { background: #2563eb; }
        .content { padding: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th { background: var(--primary); color: white; padding: 12px 2px; font-size: 14px; }
        td { border-bottom: 1px solid #f1f5f9; padding: 10px 0; text-align: center; }
        .col-info { width: 95px; text-align: left; padding-left: 6px; }
        .name-text { font-size: 15px; font-weight: bold; display: block; white-space: nowrap; }
        .sub-info { font-size: 10px; color: #64748b; display: block; }
        input[type="number"] { width: 44px; height: 36px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; }
        .total-cell { font-weight: bold; color: var(--accent); font-size: 19px; }
        .print-val { display: none; }
        @media print {
            .no-print, .sticky-header { display: none !important; }
            .print-val { display: inline-block !important; font-size: 16px; font-weight: bold; }
            input { display: none !important; }
            table { width: 100%; border: 1px solid #000; table-layout: auto; }
            th, td { border: 1px solid #000; padding: 6px; color: black !important; }
            tr.invalid-row { display: none !important; }
        }
    </style>
</head>
<body>

<div class="sticky-header no-print">
    <div class="nav-bar">
        <script>for(let i=1; i<=12; i++) document.write(`<button class="nav-btn" onclick="goToGroup(${i})">${i}</button>`);</script>
    </div>
    <div class="action-bar">
        <button class="btn btn-rank" onclick="calculateRank()">📊 計算排名</button>
        <button class="btn btn-print" onclick="handlePrint()">🖨️ 列印完賽者</button>
        <button style="background:#94a3b8; width: 40px; height:40px; border-radius:8px;" class="btn" onclick="clearData()">✕</button>
    </div>
</div>

<div class="content">
    <table id="mainTable">
        <thead>
            <tr>
                <th style="width:30px">#</th>
                <th class="col-info">選手</th>
                <th>球1</th>
                <th>球2</th>
                <th>總分</th>
                <th>HIO</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
   const players = [
        {name:"陳浩華", bday:"39.12.21", group:"1-1"}, {name:"黃麗卿", bday:"33.11.28", group:"1-2"}, {name:"賴建亨", bday:"41.12.18", group:"1-3"}, {name:"柯重雄", bday:"30.03.20", group:"1-4"}, {name:"李日伸", bday:"43.06.05", group:"1-5"}, {name:"林秀美", bday:"49.11.10", group:"1-6"},
        {name:"夏文忠", bday:"47.07.26", group:"2-1"}, {name:"孫武復", bday:"36.01.10", group:"2-2"}, {name:"吳忠政", bday:"60.03.23", group:"2-3"}, {name:"陳 和", bday:"26.02.22", group:"2-4"}, {name:"吳柏毅", bday:"45.01.05", group:"2-5"}, {name:"傅劉菊香", bday:"36.07.06", group:"2-6"},
        {name:"曾有奇", bday:"51.05.20", group:"3-1"}, {name:"涂金葉", bday:"36.08.17", group:"3-2"}, {name:"辜德勝", bday:"41.01.18", group:"3-3"}, {name:"王明山", bday:"35.04.20", group:"3-4"}, {name:"王米吉", bday:"31.03.01", group:"3-5"}, {name:"吳沛柔", bday:"41.05.01", group:"3-6"},
        {name:"洪肇漢", bday:"47.05.01", group:"4-1"}, {name:"王國明", bday:"49.11.29", group:"4-2"}, {name:"廖九紅", bday:"36.10.07", group:"4-3"}, {name:"劉玉嬌", bday:"45.01.25", group:"4-4"}, {name:"王忠富", bday:"45.01.09", group:"4-5"}, {name:"傅芳紳", bday:"28.09.26", group:"4-6"},
        {name:"夏淑錠", bday:"50.02.04", group:"5-1"}, {name:"溫三郎", bday:"30.09.02", group:"5-2"}, {name:"鄭木雄", bday:"46.01.11", group:"5-3"}, {name:"江麗珠", bday:"35.07.25", group:"5-4"}, {name:"陳龍文", bday:"39.08.14", group:"5-5"}, {name:"利 梅", bday:"30.10.06", group:"5-6"},
        {name:"陳碧珠", bday:"47.12.21", group:"6-1"}, {name:"徐富美", bday:"34.07.08", group:"6-2"}, {name:"林順誠", bday:"44.11.15", group:"6-3"}, {name:"賴秀滿", bday:"40.02.02", group:"6-4"}, {name:"黃茂樟", bday:"40.09.26", group:"6-5"}, {name:"黃全田", bday:"39.09.10", group:"6-6"},
        {name:"廖進忠", bday:"38.06.30", group:"7-1"}, {name:"林育堂", bday:"51.01.17", group:"7-2"}, {name:"牛巽康", bday:"38.02.21", group:"7-3"}, {name:"江麗容", bday:"49.08.21", group:"7-4"}, {name:"江明芳", bday:"43.11.16", group:"7-5"}, {name:"王榮助", bday:"31.12.03", group:"7-6"},
        {name:"邱金生", bday:"47.04.28", group:"8-1"}, {name:"廖 耍", bday:"44.11.08", group:"8-2"}, {name:"王李麗卿", bday:"39.06.30", group:"8-3"}, {name:"李正喜", bday:"30.09.05", group:"8-4"}, {name:"張月琴", bday:"45.12.12", group:"8-5"}, {name:"高文鴻", bday:"40.01.15", group:"8-6"}, {name:"鍾寶妹", bday:"50.10.19", group:"8-7"},
        {name:"楊文祥", bday:"46.05.23", group:"9-1"}, {name:"李香蘭", bday:"39.12.30", group:"9-2"}, {name:"林金朝", bday:"36.08.27", group:"9-3"}, {name:"郭嬌", bday:"44.10.10", group:"9-4"}, {name:"陳金鑾", bday:"43.03.10", group:"9-5"}, {name:"許志男", bday:"45.12.09", group:"9-6"}, {name:"林秀滿", bday:"57.02.01", group:"9-7"},
        {name:"呂銘宸", bday:"43.08.01", group:"10-1"}, {name:"陳鑾鳳", bday:"36.02.02", group:"10-2"}, {name:"莊登章", bday:"39.08.28", group:"10-3"}, {name:"傅元金", bday:"34.11.01", group:"10-4"}, {name:"姜彩花", bday:"49.10.19", group:"10-5"}, {name:"黃 春", bday:"61.02.13", group:"10-6"}, {name:"曾嬿珍", bday:"36.05.24", group:"10-7"}
    ];

    const STORE_KEY = 'golf_final_validated_v3';
    let isRankedView = false;

    function init() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        players.forEach((p) => {
            const key = p.name + p.group;
            const d = saved[key] || {s1:'', s2:'', hio:''};
            const row = document.createElement('tr');
            row.className = `group-row-${p.group.split('-')[0]}`;
            row.setAttribute('data-bday', p.bday);
            row.setAttribute('data-key', key);
            row.innerHTML = `
                <td class="rank-cell">-</td>
                <td class="col-info"><span class="name-text">${p.name}</span><span class="sub-info">${p.group} | ${p.bday}</span></td>
                <td><input type="number" class="s1" value="${d.s1}" oninput="valRow(this);nx(this)"><span class="print-val">${d.s1}</span></td>
                <td><input type="number" class="s2" value="${d.s2}" oninput="valRow(this)"><span class="print-val">${d.s2}</span></td>
                <td><span class="total-cell">-</span></td>
                <td><input type="number" class="hio" value="${d.hio}" oninput="valRow(this)"><span class="print-val">${d.hio}</span></td>
            `;
            tbody.appendChild(row);
            valRow(row.querySelector('.s1'), false);
        });
    }

    function valRow(el, save = true) {
        const r = el.closest('tr');
        const v1 = r.querySelector('.s1'), v2 = r.querySelector('.s2'), vh = r.querySelector('.hio');
        const s1 = parseInt(v1.value) || 0, s2 = parseInt(v2.value) || 0;
        const total = s1 + s2;
        const tc = r.querySelector('.total-cell');

        // 規則：只要總分 > 20 就視為合格
        if (v1.value === '' && v2.value === '') {
            tc.innerText = "-";
            r.classList.add('invalid-row');
        } else if (total < 20) {
            tc.innerText = total;
            r.classList.add('invalid-row');
        } else {
            tc.innerText = total;
            r.classList.remove('invalid-row');
        }

        r.querySelectorAll('.print-val')[0].innerText = v1.value;
        r.querySelectorAll('.print-val')[1].innerText = v2.value;
        r.querySelectorAll('.print-val')[2].innerText = vh.value;

        if(save) {
            const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
            s[r.getAttribute('data-key')] = { s1: v1.value, s2: v2.value, hio: vh.value };
            localStorage.setItem(STORE_KEY, JSON.stringify(s));
        }
    }

    function goToGroup(num) {
        if(isRankedView) restoreOriginalOrder();
        const f = document.querySelector(`.group-row-${num}`);
        if(f) {
            setTimeout(() => {
                window.scrollTo({ top: f.getBoundingClientRect().top + window.pageYOffset - 140, behavior: 'smooth' });
            }, 50);
        }
    }

    function restoreOriginalOrder() {
        const tbody = document.getElementById('tableBody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const orderMap = {};
        players.forEach((p, idx) => orderMap[p.name + p.group] = idx);
        rows.sort((a, b) => orderMap[a.getAttribute('data-key')] - orderMap[b.getAttribute('data-key')]);
        tbody.innerHTML = '';
        rows.forEach(r => tbody.appendChild(r));
        isRankedView = false;
    }

    function nx(el) { if(el.value.length >= 2) el.closest('tr').querySelector('.s2').focus(); }

    function calculateRank() {
        const rs = Array.from(document.querySelectorAll('#tableBody tr'));
        const dt = rs.map(r => {
            const s1 = parseInt(r.querySelector('.s1').value) || 0;
            const s2 = parseInt(r.querySelector('.s2').value) || 0;
            const t = s1 + s2;
            const ok = t >= 20; // 只要總桿數大於 20 就算完賽
            return { r, t: ok ? t : 99999, h: parseInt(r.querySelector('.hio').value)||0, b: r.getAttribute('data-bday'), ok };
        });
        dt.sort((a,b) => a.t - b.t || b.h - a.h || a.b.localeCompare(b.b));
        const b = document.getElementById('tableBody'); b.innerHTML = '';
        dt.forEach((it, i) => {
            it.r.querySelector('.rank-cell').innerText = it.ok ? (i+1) : "-";
            b.appendChild(it.r); 
        });
        isRankedView = true;
        window.scrollTo(0,0);
    }

    function handlePrint() { 
        calculateRank(); 
        setTimeout(() => { window.print(); }, 300); 
    }
    
    function clearData() { if(confirm("確定清空分數？")) { localStorage.removeItem(STORE_KEY); location.reload(); } }
    init();
</script>
</body>
</html>
